<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ashlight</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="styles.css?v=0.9.0-mw9jxdls" />
    <link rel="stylesheet" href="controls.css?v=0.9.0-mw9jxdls" />
    <link rel="stylesheet" href="demo.css?v=0.9.0-mw9jxdls" />
  </head>
  <body>
    <canvas class="smoke" id="smoke" aria-hidden="true"></canvas>
    <div class="bg-layer" id="bg" aria-hidden="true"></div>
    <svg class="filters" aria-hidden="true" width="0" height="0">
      <!-- Bends the picture behind liquid-glass panels a little, like thick glass, without blurring it. -->
      <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <aside class="side">
      <div class="lights" id="lights"></div>
      <div class="brand">
        <img src="logo.png" alt="" draggable="false" />
        <span>Ashlight</span>
      </div>
      <nav id="nav" aria-label="Pages"><span class="nav-pill" id="pill"></span></nav>
      <button class="profile" id="profile"></button>
    </aside>
    <main>
      <div class="titlebar"><div class="lights" id="lightsRight"></div></div>
      <div class="page-wrap" id="page"></div>
    </main>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="demo.js?v=0.9.0-mw9jxdls"></script>
  </body>
</html>
